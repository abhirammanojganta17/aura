<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AuraStream Pro</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%2310122a'/%3E%3Cg fill='%237ee0e6'%3E%3Crect x='142' y='216' width='32' height='80' rx='16'/%3E%3Crect x='199' y='181' width='32' height='150' rx='16'/%3E%3Crect x='240' y='146' width='32' height='220' rx='16'/%3E%3Crect x='281' y='181' width='32' height='150' rx='16'/%3E%3Crect x='338' y='206' width='32' height='100' rx='16'/%3E%3C/g%3E%3C/svg%3E" />
<style>
:root{--bg:#07080d;--side:#0c0e16;--card:rgba(255,255,255,.06);--hover:rgba(255,255,255,.12);--active:rgba(126,224,230,.18);--accent:#7ee0e6;--red:#ff4d5e;--muted:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:radial-gradient(circle at top left,#181a2e,var(--bg) 60%);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.ic{width:18px;height:18px;fill:currentColor;flex-shrink:0}.sm{width:15px;height:15px;fill:currentColor;flex-shrink:0}
header{padding:14px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:rgba(12,14,22,.95);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-size:1.35rem;font-weight:800;display:flex;align-items:center;gap:10px}.logo span{color:var(--accent)}
.badge{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center}
.top{display:flex;gap:8px;flex:1;max-width:620px;align-items:center}
.sbox{position:relative;flex:1;display:flex;align-items:center}
.sbox .ic{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.sbox input{width:100%;padding:9px 16px 9px 40px;border-radius:24px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.5);color:#fff;font-size:.9rem;outline:none}
.sbox input:focus{border-color:var(--accent)}
.btn{padding:9px 16px;border-radius:24px;border:none;background:var(--accent);color:#000;font-weight:600;cursor:pointer;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.alt{background:rgba(255,255,255,.14);color:#fff}
input[type=file]{display:none}
.body{display:flex;flex:1;overflow:hidden;padding-bottom:92px}
aside{width:240px;background:var(--side);border-right:1px solid rgba(255,255,255,.08);padding:20px 14px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.gt{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:0 10px;margin-bottom:6px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;color:#fff;cursor:pointer;font-size:.9rem;font-weight:500;background:transparent;border:none;width:100%;text-align:left}
.nav-l{display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nav:hover,.nav.active{background:rgba(126,224,230,.14);color:var(--accent)}
.cnt{background:rgba(255,255,255,.14);color:#fff;padding:2px 8px;border-radius:12px;font-size:.75rem}
.plh{display:flex;justify-content:space-between;align-items:center;padding:0 10px;margin-bottom:6px}
.plh .gt{margin:0;padding:0}
.addpl{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:14px;padding:3px 9px;font-size:.75rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
main{flex:1;padding:22px 28px;overflow-y:auto}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pill{padding:7px 14px;border-radius:20px;background:rgba(255,255,255,.08);font-size:.82rem;cursor:pointer;border:1px solid transparent}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.title{font-size:1.25rem;font-weight:700}.status{font-size:.82rem;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:18px}
.msg{grid-column:1/-1;color:var(--muted);line-height:1.6;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.card{background:var(--card);padding:12px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,.06);transition:transform .15s,background .15s}
.card:hover{background:var(--hover);transform:translateY(-3px)}
.card.playing{background:var(--active);border-color:var(--accent)}
.art{position:relative;width:100%;aspect-ratio:1/1;margin-bottom:10px;border-radius:8px;overflow:hidden;background:#161822}
.art img{width:100%;height:100%;object-fit:cover}
.ov{position:absolute;bottom:8px;left:8px;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);transition:.2s}
.card:hover .ov,.card.playing .ov{opacity:1;transform:none}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.ib{width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.78);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib:hover{transform:scale(1.1)}.ib.liked{color:var(--red)}
.dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.82);font-size:.7rem;padding:3px 7px;border-radius:6px}
.st{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.sa{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{text-align:center;margin:26px 0 10px}
.pbar{position:fixed;bottom:0;left:0;width:100%;height:92px;background:rgba(10,12,18,.98);border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}
.np{display:flex;align-items:center;gap:12px;width:30%;min-width:180px}
.np img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222}
.np>div{overflow:hidden}
.ctrl{display:flex;flex-direction:column;align-items:center;width:42%;max-width:520px;gap:6px}
.tb{display:flex;align-items:center;gap:18px}
.nb{background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;padding:4px}
.nb:hover{color:#fff}.nb.on{color:var(--accent)}
.play{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center}
.prog{width:100%;display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer}
.vol{width:20%;max-width:170px;display:flex;align-items:center;gap:8px}
.q{font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:4px;color:var(--accent);border:1px solid var(--accent);display:inline-block;margin-top:3px}
/* YouTube window (YouTube requires the player to stay visible) */
.video{position:fixed;right:18px;bottom:108px;width:256px;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 8px 28px rgba(0,0,0,.6);z-index:90;border:1px solid rgba(255,255,255,.14)}
.video.min{width:120px}
.vh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:#12141d;font-size:.7rem;color:var(--muted)}
.vh button{background:none;border:none;color:#fff;cursor:pointer;font-size:.8rem}
.vbox{aspect-ratio:16/9;width:100%}.vbox iframe{width:100%;height:100%}
@media(max-width:760px){aside{display:none}.vol{display:none}.np{width:36%}.ctrl{width:64%}main{padding:16px}.video{bottom:100px;right:8px;width:200px}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="badge"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div><div>Aura<span>Stream</span></div></div>
  <div class="top">
    <div class="sbox">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Search any Telugu, Hindi, English song or artist..." />
    </div>
    <button class="btn" onclick="searchMusic()">Search</button>
    <label class="btn alt" title="Play local audio files">
      <svg class="sm" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>Local Files
      <input type="file" id="localFileInput" accept="audio/*" multiple />
    </label>
  </div>
</header>

<div class="body">
  <aside>
    <div>
      <div class="gt">Library &amp; Browse</div>
      <button class="nav active" onclick="showDiscover()"><span class="nav-l"><svg class="ic" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Discover Music</span></button>
      <button class="nav" onclick="showLiked()"><span class="nav-l"><svg class="ic" style="color:var(--red)" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>Liked Songs</span><span class="cnt" id="likedCount">0</span></button>
      <button class="nav" onclick="resetKey()"><span class="nav-l"><svg class="ic" viewBox="0 0 24 24"><path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>YouTube API Key</span></button>
    </div>
    <div>
      <div class="plh"><span class="gt">Custom Playlists</span><button class="addpl" onclick="createPlaylist()">+ New</button></div>
      <div id="plSide"></div>
    </div>
  </aside>

  <main>
    <div class="pills">
      <span class="pill" onclick="quickSearch('Telugu top hits')">Telugu Blockbusters</span>
      <span class="pill" onclick="quickSearch('Anirudh Ravichander songs')">Anirudh Hits</span>
      <span class="pill" onclick="quickSearch('Thaman S Telugu songs')">Thaman Mass</span>
      <span class="pill" onclick="quickSearch('Devi Sri Prasad songs')">DSP Hits</span>
      <span class="pill" onclick="quickSearch('Arijit Singh songs')">Hindi Chartbusters</span>
      <span class="pill" onclick="quickSearch('The Weeknd songs')">Global English Pop</span>
    </div>
    <div class="bar"><h2 class="title" id="heading">Trending Telugu Hits</h2><span class="status" id="status">Ready</span></div>
    <div class="grid" id="grid"></div>
    <div class="more"><button class="btn" id="moreBtn" onclick="loadMore()" style="display:none">Load More Songs</button></div>
  </main>
</div>

<div class="video" id="videoWin">
  <div class="vh"><span>Now streaming from YouTube</span><button onclick="toggleVideo()" title="Shrink / expand">&#8212;</button></div>
  <div class="vbox"><div id="ytPlayer"></div></div>
</div>

<div class="pbar">
  <div class="np">
    <img id="pArt" alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23161822'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' fill='%237ee0e6' font-family='sans-serif' font-size='20' font-weight='bold'>AURA</text></svg>" />
    <div><div class="st" id="pTitle">Click any song to play</div><div class="sa" id="pArtist">AuraStream Audio Engine</div><span class="q" id="pBadge">FULL SONG READY</span></div>
  </div>
  <div class="ctrl">
    <div class="tb">
      <button class="nb" id="shufBtn" onclick="toggleShuffle()" title="Shuffle"><svg class="ic" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button class="nb" onclick="prevTrack()" title="Previous"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
      <button class="play" onclick="togglePlay()" title="Play / Pause"><svg class="ic" id="ppSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="nb" onclick="nextTrack()" title="Next"><svg class="ic" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="nb" id="repBtn" onclick="toggleRepeat()" title="Repeat"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
    <div class="prog"><span id="curT">0:00</span><input type="range" id="progBar" value="0" min="0" max="100" step="0.1" /><span id="durT">0:00</span></div>
  </div>
  <div class="vol">
    <button class="nb" onclick="toggleMute()" title="Mute"><svg class="ic" id="volSvg" viewBox="0 0 24 24"></svg></button>
    <input type="range" id="volBar" min="0" max="1" step="0.02" value="0.9" />
  </div>
</div>

<audio id="audio"></audio>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ===== SETUP: paste your YouTube Data API v3 key here, or leave empty and the site will ask for it once ===== */
var API_KEY = 'AIzaSyAkc12zwXvmu2PyianMDwn8hOdZmi3Txzw';

var ART = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='%23161822'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%237ee0e6' font-family='sans-serif' font-size='36' font-weight='bold'>MUSIC</text></svg>";
var PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
var VON = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
var VOFF = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

var query = 'Telugu top hits', nextToken = '', view = 'search';
var queue = [], playQueue = [], curId = null, curIdx = -1, mode = 'yt';
var shuffle = false, repeat = false, muted = false, vol = 0.9;
var liked = [], playlists = {};
try { liked = JSON.parse(localStorage.getItem('aura_liked') || '[]'); playlists = JSON.parse(localStorage.getItem('aura_pl') || '{}'); } catch (e) {}

var $ = function (id) { return document.getElementById(id); };
var audio = $('audio'), grid = $('grid'), statusEl = $('status'), ytPlayer = null, ytReady = false, pendingId = null, timer = null;

function getKey() {
  var k = API_KEY || '';
  try { k = k || localStorage.getItem('aura_ytkey') || ''; } catch (e) {}
  return k;
}
function askKey() {
  var k = prompt('Paste your YouTube Data API v3 key:');
  if (k && k.trim()) { try { localStorage.setItem('aura_ytkey', k.trim()); } catch (e) {} return k.trim(); }
  return '';
}
function resetKey() {
  try { localStorage.removeItem('aura_ytkey'); } catch (e) {}
  var k = askKey(); if (k) runSearch(query, false);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function decode(s) { var t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; }
function fmt(sec) { if (!sec || isNaN(sec)) return '0:00'; var m = Math.floor(sec / 60), s = Math.floor(sec % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
function isoToSec(d) { var m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d || '') || []; return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0); }
function setIcon(p) { $('ppSvg').innerHTML = p ? PAUSE : PLAY; }

/* ---------- YouTube player ---------- */
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('ytPlayer', {
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, controls: 0, rel: 0, modestbranding: 1 },
    events: {
      onReady: function () { ytReady = true; ytPlayer.setVolume(vol * 100); if (pendingId) { ytPlayer.loadVideoById(pendingId); pendingId = null; } },
      onStateChange: function (e) {
        if (mode !== 'yt') return;
        if (e.data === YT.PlayerState.PLAYING) { setIcon(true); renderGrid(); }
        else if (e.data === YT.PlayerState.PAUSED) { setIcon(false); }
        else if (e.data === YT.PlayerState.ENDED) { if (repeat) { ytPlayer.seekTo(0); ytPlayer.playVideo(); } else nextTrack(); }
      },
      onError: function () { statusEl.textContent = 'This video cannot be embedded. Skipping to next song...'; setTimeout(nextTrack, 1200); }
    }
  });
  timer = setInterval(tick, 500);
}
function tick() {
  if (mode !== 'yt' || !ytReady || !ytPlayer.getDuration) return;
  var d = ytPlayer.getDuration(), c = ytPlayer.getCurrentTime();
  if (d > 0) { $('progBar').value = (c / d) * 100; $('curT').textContent = fmt(c); $('durT').textContent = fmt(d); }
}
function toggleVideo() { $('videoWin').classList.toggle('min'); }

/* ---------- Search ---------- */
function runSearch(q, append) {
  var key = getKey() || askKey();
  if (!key) { grid.innerHTML = '<div class="msg">A YouTube API key is needed to search songs.<button class="btn" onclick="resetKey()">Add API key</button></div>'; return; }
  if (!append) { grid.innerHTML = '<div class="msg">Loading songs...</div>'; nextToken = ''; }
  statusEl.textContent = 'Fetching tracks...';
  var url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=30&q=' + encodeURIComponent(q) + (append && nextToken ? '&pageToken=' + nextToken : '') + '&key=' + encodeURIComponent(key);
  fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) throw new Error(j.error.message || 'API error');
    nextToken = j.nextPageToken || '';
    var items = j.items || [], ids = items.map(function (i) { return i.id.videoId; }).join(',');
    return fetch('https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=' + ids + '&key=' + encodeURIComponent(key))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var dur = {}; (d.items || []).forEach(function (v) { dur[v.id] = isoToSec(v.contentDetails.duration); });
        var mapped = items.map(function (i) {
          var t = i.snippet.thumbnails || {}, th = (t.high || t.medium || t.default || {}).url || ART;
          return { id: i.id.videoId, title: decode(i.snippet.title), artist: decode(i.snippet.channelTitle), art: th, dur: dur[i.id.videoId] || 0, src: 'yt' };
        }).filter(function (t) { return t.dur === 0 || t.dur <= 900; });
        queue = append ? queue.concat(mapped) : mapped;
        statusEl.textContent = 'Loaded ' + queue.length + ' full-length songs';
        $('moreBtn').style.display = nextToken ? 'inline-flex' : 'none';
        renderGrid();
      });
  }).catch(function (err) {
    statusEl.textContent = 'Search failed';
    grid.innerHTML = '<div class="msg">Could not load songs: ' + esc(err.message) + '<br>Check that YouTube Data API v3 is enabled for your key, or that the daily quota is not used up.<button class="btn" onclick="resetKey()">Change API key</button></div>';
  });
}
function searchMusic() { var q = $('searchInput').value.trim(); if (!q) return; quickSearch(q, true); }
function quickSearch(q, fromBox) {
  if (!fromBox) $('searchInput').value = q;
  query = q; view = 'search'; $('heading').textContent = 'Results for "' + q + '"'; runSearch(q, false);
}
function loadMore() { if (view === 'search') runSearch(query, true); }
function showDiscover() { view = 'search'; $('heading').textContent = 'Trending Telugu Hits'; query = 'Telugu top hits'; runSearch(query, false); }

/* ---------- Grid ---------- */
var HEART = '<svg class="sm" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
var PLUS = '<svg class="sm" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>';
function renderGrid() {
  if (!queue.length) { grid.innerHTML = '<div class="msg">' + (view === 'search' ? 'No songs found. Try another artist or movie name.' : 'Nothing here yet. Tap the heart or + on any song to add it.') + '</div>'; return; }
  grid.innerHTML = '';
  queue.forEach(function (t, idx) {
    var isLiked = liked.some(function (l) { return l.id === t.id; });
    var on = t.id === curId, playing = on && $('ppSvg').innerHTML === PAUSE;
    var c = document.createElement('div');
    c.className = 'card' + (on ? ' playing' : '');
    c.innerHTML = '<div class="art"><img src="' + esc(t.art) + '" alt="" onerror="this.src=ART" />' +
      '<div class="ov"><svg class="ic" viewBox="0 0 24 24">' + (playing ? PAUSE : PLAY) + '</svg></div>' +
      '<div class="acts"><button class="ib ' + (isLiked ? 'liked' : '') + '" title="Like" data-a="like">' + HEART + '</button><button class="ib" title="Add to playlist" data-a="pl">' + PLUS + '</button></div>' +
      (t.dur ? '<span class="dur">' + fmt(t.dur) + '</span>' : '') + '</div>' +
      '<div class="st">' + esc(t.title) + '</div><div class="sa">' + esc(t.artist) + '</div>';
    c.onclick = function (e) {
      var b = e.target.closest('button');
      if (b) { e.stopPropagation(); if (b.dataset.a === 'like') toggleLike(idx); else addToPlaylist(idx); return; }
      playFrom(idx);
    };
    grid.appendChild(c);
  });
}

/* ---------- Playback ---------- */
function playFrom(idx) { playQueue = queue.slice(); playIndex(idx); }
function playIndex(idx) {
  if (idx < 0 || idx >= playQueue.length) return;
  var t = playQueue[idx]; curIdx = idx; curId = t.id; mode = 'yt';
  audio.pause();
  $('pTitle').textContent = t.title; $('pArtist').textContent = t.artist; $('pArt').src = t.art; $('pBadge').textContent = 'FULL SONG';
  $('progBar').value = 0;
  if (ytReady) { ytPlayer.loadVideoById(t.id); ytPlayer.setVolume(vol * 100); if (muted) ytPlayer.mute(); }
  else pendingId = t.id;
  setIcon(true); renderGrid();
}
function togglePlay() {
  if (mode === 'yt') {
    if (!ytReady || !curId) return;
    var s = ytPlayer.getPlayerState();
    if (s === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); setIcon(false); } else { ytPlayer.playVideo(); setIcon(true); }
  } else {
    if (!audio.src) return;
    if (audio.paused) { audio.play(); setIcon(true); } else { audio.pause(); setIcon(false); }
  }
  renderGrid();
}
function nextTrack() {
  if (!playQueue.length) return;
  playIndex(shuffle ? Math.floor(Math.random() * playQueue.length) : (curIdx + 1) % playQueue.length);
}
function prevTrack() {
  if (!playQueue.length) return;
  playIndex((curIdx - 1 + playQueue.length) % playQueue.length);
}
function toggleShuffle() { shuffle = !shuffle; $('shufBtn').className = 'nb' + (shuffle ? ' on' : ''); }
function toggleRepeat() { repeat = !repeat; audio.loop = repeat; $('repBtn').className = 'nb' + (repeat ? ' on' : ''); }
function toggleMute() {
  muted = !muted; audio.muted = muted;
  if (ytReady) { muted ? ytPlayer.mute() : ytPlayer.unMute(); }
  $('volSvg').innerHTML = muted ? VOFF : VON;
}
$('volBar').oninput = function () {
  vol = +this.value; audio.volume = vol; if (ytReady) ytPlayer.setVolume(vol * 100);
  if (muted && vol > 0) toggleMute();
};
$('progBar').oninput = function () {
  var p = this.value / 100;
  if (mode === 'yt' && ytReady) { var d = ytPlayer.getDuration(); if (d) ytPlayer.seekTo(p * d, true); }
  else if (audio.duration) audio.currentTime = p * audio.duration;
};

/* ---------- Local files (multiple) ---------- */
$('localFileInput').onchange = function (e) {
  var files = Array.prototype.slice.call(e.target.files || []);
  if (!files.length) return;
  view = 'local'; $('heading').textContent = 'Local Files'; $('moreBtn').style.display = 'none';
  queue = files.map(function (f, i) {
    return { id: 'local_' + i + '_' + f.name, title: f.name.replace(/\.[^/.]+$/, ''), artist: 'Local Track', art: ART, dur: 0, src: 'local', url: URL.createObjectURL(f) };
  });
  statusEl.textContent = files.length + ' local file(s) loaded';
  renderGrid(); playFrom(0);
};
var _playIndex = playIndex;
playIndex = function (idx) {
  var t = playQueue[idx];
  if (t && t.src === 'local') {
    if (ytReady) ytPlayer.pauseVideo();
    curIdx = idx; curId = t.id; mode = 'local';
    audio.src = t.url; audio.volume = vol; audio.muted = muted; audio.play();
    $('pTitle').textContent = t.title; $('pArtist').textContent = t.artist; $('pArt').src = t.art; $('pBadge').textContent = 'LOCAL FILE';
    setIcon(true); renderGrid();
  } else _playIndex(idx);
};
audio.onended = function () { if (!repeat) nextTrack(); };
audio.ontimeupdate = function () {
  if (mode !== 'local' || !audio.duration) return;
  $('progBar').value = (audio.currentTime / audio.duration) * 100;
  $('curT').textContent = fmt(audio.currentTime); $('durT').textContent = fmt(audio.duration);
};

/* ---------- Likes & playlists ---------- */
function save() {
  try { localStorage.setItem('aura_liked', JSON.stringify(liked)); localStorage.setItem('aura_pl', JSON.stringify(playlists)); } catch (e) {}
  sidebar();
}
function toggleLike(idx) {
  var t = queue[idx], i = liked.findIndex(function (l) { return l.id === t.id; });
  if (i > -1) liked.splice(i, 1); else if (t.src === 'yt') liked.push(t);
  save(); renderGrid();
}
function showLiked() { view = 'liked'; $('heading').textContent = 'Liked Songs'; $('moreBtn').style.display = 'none'; queue = liked.slice(); renderGrid(); }
function createPlaylist() {
  var n = prompt('New playlist name:'); if (!n || !n.trim()) return;
  n = n.trim(); if (!playlists[n]) playlists[n] = []; save();
}
function addToPlaylist(idx) {
  var t = queue[idx]; if (t.src !== 'yt') return;
  var names = Object.keys(playlists);
  var n = prompt(names.length ? 'Playlist name (existing: ' + names.join(', ') + '):' : 'Name for your new playlist:');
  if (!n || !n.trim()) return; n = n.trim();
  if (!playlists[n]) playlists[n] = [];
  if (!playlists[n].some(function (p) { return p.id === t.id; })) playlists[n].push(t);
  save();
}
function openPlaylist(n) { view = 'playlist'; $('heading').textContent = 'Playlist: ' + n; $('moreBtn').style.display = 'none'; queue = (playlists[n] || []).slice(); renderGrid(); }
function sidebar() {
  $('likedCount').textContent = liked.length;
  var box = $('plSide'); box.innerHTML = '';
  Object.keys(playlists).forEach(function (n) {
    var b = document.createElement('button'); b.className = 'nav';
    b.innerHTML = '<span class="nav-l">&#9835; ' + esc(n) + '</span><span class="cnt">' + playlists[n].length + '</span>';
    b.onclick = function () { openPlaylist(n); }; box.appendChild(b);
  });
}

$('searchInput').onkeypress = function (e) { if (e.key === 'Enter') searchMusic(); };
$('volSvg').innerHTML = VON;
sidebar();
runSearch(query, false);
</script>
</body>
